openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analytics
    description: Customer churn analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyze:
    post:
      operationId: analyzeDataset
      tags: [analytics]
      summary: Analyze a customer churn CSV dataset
      description: Profiles, cleans, and analyzes uploaded tabular data without mutating the original rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Dynamic customer churn analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
        "400":
          description: Dataset could not be analyzed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnalyzeRequest:
      type: object
      properties:
        fileName:
          type: string
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              nullable: true
              oneOf:
                - type: string
                - type: number
                - type: boolean
      required:
        - columns
        - rows
    AnalyzeResponse:
      type: object
      properties:
        fileName:
          type: string
        overview:
          $ref: "#/components/schemas/DatasetOverview"
        quality:
          $ref: "#/components/schemas/DataQuality"
        target:
          $ref: "#/components/schemas/TargetInfo"
        preview:
          type: array
          items:
            type: object
            additionalProperties: true
        breakdowns:
          type: array
          items:
            $ref: "#/components/schemas/Breakdown"
        distributions:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/DistributionBin"
        scatter:
          type: array
          items:
            $ref: "#/components/schemas/ScatterPoint"
        correlations:
          type: array
          items:
            $ref: "#/components/schemas/Correlation"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
        insights:
          type: array
          items:
            type: string
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/Recommendation"
        transformations:
          type: array
          items:
            type: string
        statisticalAnalysis:
          $ref: "#/components/schemas/StatisticalAnalysis"
        predictiveModeling:
          $ref: "#/components/schemas/PredictiveModeling"
        methodology:
          type: array
          items:
            type: string
        limitations:
          type: array
          items:
            type: string
      required:
        - fileName
        - overview
        - quality
        - target
        - preview
        - breakdowns
        - distributions
        - scatter
        - correlations
        - segments
        - insights
        - recommendations
        - transformations
        - statisticalAnalysis
        - predictiveModeling
        - methodology
        - limitations
    DatasetOverview:
      type: object
      properties:
        rows:
          type: integer
        columns:
          type: integer
        churned:
          type: integer
        retained:
          type: integer
        churnRate:
          type: number
        avgTenure:
          type: number
        avgMonthlyCharges:
          type: number
        numericColumns:
          type: array
          items:
            type: string
        categoricalColumns:
          type: array
          items:
            type: string
        dateColumns:
          type: array
          items:
            type: string
      required:
        - rows
        - columns
        - churned
        - retained
        - churnRate
        - avgTenure
        - avgMonthlyCharges
        - numericColumns
        - categoricalColumns
        - dateColumns
    DataQuality:
      type: object
      properties:
        missingCells:
          type: integer
        duplicateRows:
          type: integer
        invalidValues:
          type: integer
        outlierCells:
          type: integer
        inconsistentCategories:
          type: integer
        highCardinality:
          type: array
          items:
            type: string
        lowCardinality:
          type: array
          items:
            type: string
        issues:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        minimumSegmentSampleSize:
          type: integer
        columnStats:
          type: array
          items:
            $ref: "#/components/schemas/ColumnStat"
      required:
        - missingCells
        - duplicateRows
        - invalidValues
        - outlierCells
        - inconsistentCategories
        - highCardinality
        - lowCardinality
        - issues
        - warnings
        - minimumSegmentSampleSize
        - columnStats
    ColumnStat:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        missing:
          type: integer
        unique:
          type: integer
        sample:
          type: string
      required:
        - name
        - type
        - missing
        - unique
        - sample
    TargetInfo:
      type: object
      properties:
        column:
          type: string
        positiveLabel:
          type: string
        negativeLabel:
          type: string
        detected:
          type: boolean
      required:
        - column
        - positiveLabel
        - negativeLabel
        - detected
    Breakdown:
      type: object
      properties:
        dimension:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BreakdownRow"
      required:
        - dimension
        - rows
    BreakdownRow:
      type: object
      properties:
        label:
          type: string
        total:
          type: integer
        churned:
          type: integer
        rate:
          type: number
        average:
          type: number
        reliable:
          type: boolean
      required:
        - label
        - total
        - churned
        - rate
        - average
        - reliable
    DistributionBin:
      type: object
      properties:
        label:
          type: string
        churned:
          type: integer
        retained:
          type: integer
      required:
        - label
        - churned
        - retained
    ScatterPoint:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        churned:
          type: boolean
      required:
        - x
        - y
        - churned
    Correlation:
      type: object
      properties:
        feature:
          type: string
        value:
          type: number
        strength:
          type: string
      required:
        - feature
        - value
        - strength
    Segment:
      type: object
      properties:
        name:
          type: string
        customers:
          type: integer
        churnRate:
          type: number
        avgCharges:
          type: number
        avgTenure:
          type: number
        characteristics:
          type: string
        risk:
          type: string
      required:
        - name
        - customers
        - churnRate
        - avgCharges
        - avgTenure
        - characteristics
        - risk
    Recommendation:
      type: object
      properties:
        problem:
          type: string
        evidence:
          type: string
        action:
          type: string
        objective:
          type: string
        segment:
          type: string
      required:
        - problem
        - evidence
        - action
        - objective
        - segment
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    StatisticalAnalysis:
      type: object
      properties:
        tests:
          type: array
          items:
            $ref: "#/components/schemas/StatisticalTest"
        correction:
          type: string
        alpha:
          type: number
        notes:
          type: array
          items:
            type: string
      required:
        - tests
        - correction
        - alpha
        - notes
    StatisticalTest:
      type: object
      properties:
        feature:
          type: string
        variableType:
          type: string
        test:
          type: string
        statisticName:
          type: string
        statistic:
          type: number
        pValue:
          nullable: true
          type: number
        adjustedPValue:
          nullable: true
          type: number
        effectSize:
          nullable: true
          type: number
        effectSizeLabel:
          type: string
        significant:
          type: boolean
        sampleSize:
          type: integer
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupRate"
        notes:
          type: string
      required:
        - feature
        - variableType
        - test
        - statisticName
        - statistic
        - pValue
        - adjustedPValue
        - effectSize
        - effectSizeLabel
        - significant
        - sampleSize
        - groups
        - notes
    GroupRate:
      type: object
      properties:
        group:
          type: string
        total:
          type: integer
        churned:
          type: integer
        churnRate:
          type: number
        reliable:
          type: boolean
      required:
        - group
        - total
        - churned
        - churnRate
        - reliable
    PredictiveModeling:
      type: object
      properties:
        targetDetected:
          type: boolean
        bestModel:
          type: string
        trainSize:
          type: integer
        testSize:
          type: integer
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelResult"
        methodology:
          type: array
          items:
            type: string
        leakageChecks:
          type: array
          items:
            type: string
        notes:
          type: array
          items:
            type: string
      required:
        - targetDetected
        - bestModel
        - trainSize
        - testSize
        - models
        - methodology
        - leakageChecks
        - notes
    ModelResult:
      type: object
      properties:
        model:
          type: string
        accuracy:
          type: number
        precision:
          type: number
        recall:
          type: number
        f1:
          type: number
        rocAuc:
          type: number
        confusionMatrix:
          $ref: "#/components/schemas/ConfusionMatrix"
        featureImportance:
          type: array
          items:
            $ref: "#/components/schemas/FeatureImportance"
      required:
        - model
        - accuracy
        - precision
        - recall
        - f1
        - rocAuc
        - confusionMatrix
        - featureImportance
    ConfusionMatrix:
      type: object
      properties:
        truePositive:
          type: integer
        falsePositive:
          type: integer
        trueNegative:
          type: integer
        falseNegative:
          type: integer
      required:
        - truePositive
        - falsePositive
        - trueNegative
        - falseNegative
    FeatureImportance:
      type: object
      properties:
        feature:
          type: string
        importance:
          type: number
      required:
        - feature
        - importance

