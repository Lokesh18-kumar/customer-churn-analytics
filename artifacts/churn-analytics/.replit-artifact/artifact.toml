kind = "data-app"
previewPath = "/"
title = "Customer Churn Analytics"
description = "An interactive customer churn analysis dashboard that accepts CSV uploads, profiles data quality, computes dynamic churn metrics and segments, and exports an evidence-backed business report."
version = "1.0.0"
id = "artifacts/churn-analytics"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18605

[services.development]
run = "pnpm --filter @workspace/churn-analytics run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/churn-analytics", "run", "build" ]
serve = "static"
publicDir = "artifacts/churn-analytics/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18605"
BASE_PATH = "/"
